name: "Push secrets from 1Password to Heroku"

permissions:
  id-token: write
  contents: read

on:
  push:
    branches:
      - "heroku-push-secrets-*"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/push-1password-secrets-to-heroku.yaml
      - sync-secrets-heroku/Pulumi.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  push-heroku-secrets:
    name: "Push Heroku Secret"
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0

      - name: Load Heroku token
        id: op-heroku-token
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          HEROKU_API_KEY: op://pulumi/heroku-pulumi-runner-token/credential

      - uses: pulumi/auth-actions@141415910c3beb54e03b48e9057c204c97b956f2 # v2.1.0
        with:
          organization: conda-forge
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:conda-forge-bot

      - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          command: ${{ github.event_name == 'pull_request' && 'preview' || 'up' }}
          refresh: true
          stack-name: conda-forge/sync-secrets-heroku/secrets
          work-dir: "./sync-secrets-heroku"
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          HEROKU_API_KEY: ${{ steps.op-heroku-token.outputs.HEROKU_API_KEY }}
